name: Website checks

# Lints and builds the marketing site on every pull request and every push to
# main.
#
# ## This is a signal, not a gate
#
# Cloudflare Pages reacts to the same push in parallel and has no idea this
# workflow exists. A red run here does NOT stop a deploy. To make it a real
# gate, protect `main` and mark the `check` job as a required status check —
# then a red run blocks the merge, and only merged code reaches Cloudflare.
#
# ## Why the build step matters more than it looks
#
# `npm run build` is `node scripts/fetch-content.mjs && next build`. The fetch
# pulls live content from Sanity, so this job also proves the CMS query still
# works against the real dataset and that every published document still
# renders. A schema change that breaks a page fails here rather than on the
# live site.
#
# `next build` also runs TypeScript, so there is no separate typecheck step —
# a type error fails the build.
#
# ## Bun here AND on Cloudflare — keep it that way
#
# The repo commits `bun.lock` and no `package-lock.json`. Cloudflare originally
# ran `npm install`, which ignores `bun.lock` entirely, so production resolved
# an unpinned dependency tree that this job never tested. Cloudflare's build
# command is now `bun install --frozen-lockfile && bun run build`, which closes
# that gap.
#
# The mis-detection is worth knowing about: Cloudflare looks for the old binary
# `bun.lockb`, not the text `bun.lock` that Bun 1.2+ writes, so it silently
# falls back to npm. Setting the build command explicitly is what overrides it.
#
# 🔴 BUN_VERSION below must match the `BUN_VERSION` variable on the Cloudflare
# Pages project. Pinned rather than `latest` so a new Bun release cannot change
# what CI tests without also changing what production builds.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.14' # matches the Cloudflare Pages BUN_VERSION variable

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --frozen-lockfile so a lockfile that was never committed fails here
      # rather than on someone else's machine.
      - name: Install dependencies
        working-directory: aastha-enterprise
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: aastha-enterprise
        run: bun run lint

      # Fetches from Sanity, then builds and typechecks. No secrets needed: the
      # dataset is public, and NEXT_PUBLIC_WEB3FORMS_KEY is optional at build
      # time (the form falls back to an empty key), so its absence cannot fail
      # this job — it only matters for the deployed bundle.
      - name: Build
        working-directory: aastha-enterprise
        run: bun run build
